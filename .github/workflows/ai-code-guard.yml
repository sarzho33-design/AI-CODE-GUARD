name: AI Code Guard
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - uses: sarzho33-design/AI-CODE-GUARD@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on: critical
